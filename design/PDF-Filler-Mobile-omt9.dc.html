<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="ds/radius-ui/tokens/fonts.css">
  <link rel="stylesheet" href="ds/radius-ui/tokens/colors.css">
  <link rel="stylesheet" href="src/regular/style.css">
  <script src="ds/radius-ui/_ds_bundle.js"></script>
  <style>
    @font-face{font-family:"Phosphor";src:url("/_blob/438dda85d2d284a1882426ac5d2e0b24") format("woff2");font-weight:normal;font-style:normal;font-display:block}
    html,body{margin:0;font-family:"Mona Sans",-apple-system,sans-serif;color:#0A0A0A}
    a{color:#5A5FF2;text-decoration:none}a:hover{color:#4449d9;text-decoration:underline}
    .ph{line-height:1}
  </style>
</helmet>
<div style="min-height:100vh;box-sizing:border-box;padding:32px 24px;display:flex;align-items:center;justify-content:center;background:{{ stageBg }};transition:background .25s ease">

  <div role="radiogroup" aria-label="Appearance" style="position:fixed;top:20px;right:20px;z-index:1000;display:flex;align-items:center;gap:2px;padding:4px;border-radius:24px;background:{{ swBg }};border:1px solid {{ swEdge }};-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 8px 24px rgba(0,0,0,.18);transition:background .25s ease">
    <button type="button" role="radio" aria-checked="{{ isLight }}" onClick="{{ toLight }}" style="{{ lightStyle }}"><i class="ph ph-sun" aria-hidden="true" style="font-size:16px"></i>Light</button>
    <button type="button" role="radio" aria-checked="{{ isDark }}" onClick="{{ toDark }}" style="{{ darkStyle }}"><i class="ph ph-moon" aria-hidden="true" style="font-size:16px"></i>Dark</button>
  </div>

  <div style="position:relative;flex:none;width:414px;height:868px;padding:12px;box-sizing:border-box;border-radius:64px;background:#1A1A1A;box-shadow:0 0 0 2px #3A3A3A,0 40px 80px -24px rgba(0,0,0,.45)">
    <div style="position:absolute;top:23px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:100;pointer-events:none"></div>
    <div data-theme="{{ theme }}" style="{{ screenStyle }}">
      <dc-import name="PDF-Filler-Mobile-Screen" hint-size="390px,844px" style="position:absolute;inset:0;width:390px;height:844px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":940}}'>
const VARS={
 light:'--m-bg:#FFFFFF;--m-canvas:#F5F5F5;--m-group:#FFFFFF;--m-elev:rgba(255,255,255,.86);--m-glass:rgba(255,255,255,.86);--m-glass-edge:rgba(0,0,0,.08);--m-glass-hi:rgba(255,255,255,.9);--m-glass-lo:rgba(0,0,0,.02);--m-glass-shadow:rgba(0,0,0,.10);--m-dock:rgba(255,255,255,.9);--m-seg-on:rgba(255,255,255,.95);--m-chip:rgba(0,0,0,.06);--m-edge:rgba(245,245,245,.9);--m-fill:#F5F5F5;--m-line:#E5E5E5;--m-fg:#0A0A0A;--m-fg2:#404040;--m-mute:#737373;--m-tint:#EEEEFE;--m-tint-fg:#4B50E0;--m-link:#5A5FF2;--m-ok:#41701F;--m-warn:#C2410C;--m-scrim:rgba(10,10,10,.4);--m-shadow:0 -8px 24px rgba(0,0,0,.08);--m-toast:#0A0A0A;--m-toast-fg:#FFFFFF;--m-sheet:#FFFFFF;--m-grab:#D4D4D4;--m-close-edge:#D4D4D4;--m-close-fg:#525252;--m-warn-bg:#FFF7ED;--m-warn-edge:#FCD9BD;--m-sug-bg:linear-gradient(100deg,#F7F7FE 0%,#FCFAFD 48%,#FFFBF8 100%);--m-sug-edge:#E4E4FB;--m-mel-text:linear-gradient(90deg,#7B7FF5,#5A5FF2,#F08068,#F0A468)',
 dark:'--m-bg:#1C1C1C;--m-canvas:#1C1C1C;--m-group:#1C1C1C;--m-elev:rgba(30,30,30,.82);--m-glass:rgba(28,28,28,.86);--m-glass-edge:rgba(255,255,255,.11);--m-glass-hi:rgba(255,255,255,.05);--m-glass-lo:rgba(0,0,0,.3);--m-glass-shadow:rgba(0,0,0,.55);--m-seg-on:rgba(255,255,255,.14);--m-dock:rgba(30,30,30,.9);--m-chip:rgba(255,255,255,.1);--m-edge:rgba(0,0,0,.85);--m-fill:#262626;--m-line:#2E2E2E;--m-fg:#FAFAFA;--m-fg2:#D4D4D4;--m-mute:#A3A3A3;--m-tint:rgba(90,95,242,.22);--m-tint-fg:#A5A8FA;--m-link:#8B8FF7;--m-ok:#8BC76A;--m-warn:#F59E0B;--m-scrim:rgba(0,0,0,.6);--m-shadow:0 -8px 24px rgba(0,0,0,.5);--m-toast:#FAFAFA;--m-toast-fg:#0A0A0A;--m-sheet:#1C1C1C;--m-grab:#525252;--m-close-edge:#2E2E2E;--m-close-fg:#A3A3A3;--m-warn-bg:rgba(234,88,12,.12);--m-warn-edge:rgba(245,158,11,.45);--m-sug-bg:linear-gradient(100deg,rgba(90,95,242,.18) 0%,rgba(123,127,245,.10) 48%,rgba(240,128,104,.12) 100%);--m-sug-edge:rgba(123,127,245,.38);--m-mel-text:linear-gradient(90deg,#B4B7FB,#9A9DF8,#F7A594,#F7C196)'
};
class Component extends DCLogic {
  state={theme:(()=>{try{return localStorage.getItem('pfm-theme')||'light'}catch(e){console.warn('[theme] storage unavailable '+e);return'light'}})()};
  setTheme(t){this.setState({theme:t});try{localStorage.setItem('pfm-theme',t)}catch(e){console.warn('[theme] could not persist '+e)}}
  renderVals(){
    const t=this.state.theme,dark=t==='dark';
    const seg=on=>'height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border:0;border-radius:20px;font:inherit;font-size:14px;font-weight:'+(on?600:500)+';cursor:pointer;transition:background .18s ease,color .18s ease;color:'+(dark?(on?'#0A0A0A':'#D4D4D4'):(on?'#FFFFFF':'#404040'))+';background:'+(on?(dark?'#FAFAFA':'#5A5FF2'):'transparent');
    return{theme:t,isLight:!dark,isDark:dark,
      stageBg:dark?'#1C1C1C':'#E5E5E5',swBg:dark?'rgba(40,40,40,.7)':'rgba(255,255,255,.7)',swEdge:dark?'rgba(255,255,255,.14)':'rgba(255,255,255,.8)',
      lightStyle:seg(!dark),darkStyle:seg(dark),toLight:()=>this.setTheme('light'),toDark:()=>this.setTheme('dark'),
      screenStyle:'width:390px;height:844px;border-radius:52px;overflow:hidden;position:relative;'+VARS[t]};
  }
}
</script>
</body>
</html>
